<svg width="1600" height="650" viewBox="0 0 1600 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Agentic Ecosystem homepage banner</title>
  <desc id="desc">A dark navy and gold homepage banner showing an interconnected ecosystem of AI agents, tools, data, memory, safety, and applications orbiting a central AI core.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 290) rotate(133) scale(595 512)">
      <stop stop-color="#1C3157"/>
      <stop offset="0.42" stop-color="#0B1A32"/>
      <stop offset="1" stop-color="#06101F"/>
    </radialGradient>
    <linearGradient id="gold" x1="278" y1="105" x2="1318" y2="569" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE39B"/>
      <stop offset="0.48" stop-color="#D6A84A"/>
      <stop offset="1" stop-color="#8E681E"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="685" y1="136" x2="1191" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1B8"/>
      <stop offset="1" stop-color="#B98A31"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="764" y1="124" x2="1346" y2="541" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122B52" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#071427" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="goldGlow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#D6A84A" opacity="0.2"/>
    </pattern>
  </defs>

