<svg width="1600" height="650" viewBox="0 0 1600 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nirvana 360 orbital AI agentic ecosystem banner</title>
  <desc id="desc">A dark navy and gold homepage banner for Nirvana 360, showing a central AI ecosystem with autonomous agent nodes orbiting around it.</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 305) rotate(136) scale(730 500)">
      <stop stop-color="#1B3158"/>
      <stop offset="0.48" stop-color="#08172D"/>
      <stop offset="1" stop-color="#050B17"/>
    </radialGradient>
    <linearGradient id="gold" x1="140" y1="64" x2="1367" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1BD"/>
      <stop offset="0.46" stop-color="#D6A84A"/>
      <stop offset="1" stop-color="#8A641C"/>
    </linearGradient>
    <linearGradient id="card" x1="772" y1="118" x2="1398" y2="523" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142E55" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000814" flood-opacity="0.44"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" stroke="#D6A84A" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1.4" fill="#D6A84A" fill-opacity="0.24"/>
    </pattern>
  </defs>

  <rect width="1600" height="650" rx="34" fill="url(#background)"/>
  <rect width="1600" height="650" rx="34" fill="url(#grid)" opacity="0.82"/>
  <path d="M-42 495C186 412 309 535 524 463C749 388 743 170 982 118C1190 73 1305 195 1644 72" stroke="#D6A84A" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M-21 171C230 273 340 66 596 151C814 224 814 435 1039 454C1225 469 1331 364 1636 460" stroke="#7F96BB" stroke-opacity="0.2" stroke-width="2"/>

  <g transform="translate(116 112)">
    <text x="0" y="72" fill="#D6A84A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="5">NIRVANA 360</text>
    <text x="0" y="158" fill="#FFF6DD" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">Agentic AI</text>
    <text x="0" y="238" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">Ecosystem</text>
    <text x="4" y="300" fill="#B9C7DC" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">A connected operating layer for autonomous agents,</text>
    <text x="4" y="337" fill="#B9C7DC" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">trusted tools, memory, workflows, and decisions.</text>
    <g transform="translate(4 384)">
      <rect width="190" height="48" rx="24" fill="#D6A84A"/>
      <text x="28" y="31" fill="#071326" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Launch ecosystem</text>
      <rect x="214" width="158" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#D6A84A" stroke-opacity="0.5"/>
      <text x="243" y="31" fill="#FFEAB0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Meet agents</text>
    </g>
  </g>

  <g transform="translate(728 60)" filter="url(#shadow)">
    <circle cx="450" cy="270" r="224" fill="#061223" fill-opacity="0.34" stroke="#D6A84A" stroke-opacity="0.16" stroke-width="2"/>
    <ellipse cx="450" cy="270" rx="356" ry="214" stroke="#D6A84A" stroke-opacity="0.25" stroke-width="2"/>
    <ellipse cx="450" cy="270" rx="290" ry="146" stroke="#D6A84A" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="12 16"/>
    <ellipse cx="450" cy="270" rx="165" ry="104" stroke="#7890B8" stroke-opacity="0.22" stroke-width="2"/>

    <path d="M450 270L196 160M450 270L246 382M450 270L450 78M450 270L662 124M450 270L706 350M450 270L482 488" stroke="#D6A84A" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M196 160C295 64 558 32 662 124" stroke="#D6A84A" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M246 382C360 492 571 514 706 350" stroke="#D6A84A" stroke-opacity="0.18" stroke-width="2"/>

    <g filter="url(#glow)">
      <circle cx="450" cy="270" r="98" fill="#071326" stroke="url(#gold)" stroke-width="4"/>
      <circle cx="450" cy="270" r="70" fill="#D6A84A" fill-opacity="0.12" stroke="#FFE4A0" stroke-opacity="0.5"/>
      <text x="450" y="254" text-anchor="middle" fill="#FFF5D7" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="2">NIRVANA</text>
      <text x="450" y="292" text-anchor="middle" fill="#D6A84A" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="1">360</text>
    </g>

    <g fill="url(#card)" stroke="#D6A84A" stroke-opacity="0.45">
      <rect x="104" y="116" width="190" height="92" rx="24"/>
      <rect x="350" y="32" width="204" height="92" rx="24"/>
      <rect x="572" y="80" width="212" height="92" rx="24"/>
      <rect x="142" y="338" width="210" height="92" rx="24"/>
      <rect x="598" y="306" width="220" height="92" rx="24"/>
      <rect x="372" y="446" width="216" height="92" rx="24"/>
    </g>

    <g font-family="Inter, Arial, sans-serif">
      <g>
        <circle cx="145" cy="162" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M136 162H154M145 153V171" stroke="#FFE9B2" stroke-width="4" stroke-linecap="round"/>
        <text x="178" y="159" fill="#FFF2CD" font-size="18" font-weight="900">Agents</text>
        <text x="178" y="183" fill="#9FB0CE" font-size="13" font-weight="700">Autonomous roles</text>
      </g>
      <g>
        <circle cx="391" cy="78" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M382 79L390 87L404 68" stroke="#FFE9B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="424" y="75" fill="#FFF2CD" font-size="18" font-weight="900">Planner</text>
        <text x="424" y="99" fill="#9FB0CE" font-size="13" font-weight="700">Goal routing</text>
      </g>
      <g>
        <circle cx="613" cy="126" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M604 126H622M613 117V135" stroke="#FFE9B2" stroke-width="4" stroke-linecap="round"/>
        <text x="646" y="123" fill="#FFF2CD" font-size="18" font-weight="900">Tools</text>
        <text x="646" y="147" fill="#9FB0CE" font-size="13" font-weight="700">APIs and actions</text>
      </g>
      <g>
        <circle cx="185" cy="384" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M175 378H195V392C195 399 188 403 185 404C182 403 175 399 175 392V378Z" stroke="#FFE9B2" stroke-width="3" stroke-linejoin="round"/>
        <text x="218" y="381" fill="#FFF2CD" font-size="18" font-weight="900">Safety</text>
        <text x="218" y="405" fill="#9FB0CE" font-size="13" font-weight="700">Policy layer</text>
      </g>
      <g>
        <circle cx="641" cy="352" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M632 345H650M632 353H650M632 361H646" stroke="#FFE9B2" stroke-width="3.5" stroke-linecap="round"/>
        <text x="674" y="349" fill="#FFF2CD" font-size="18" font-weight="900">Data</text>
        <text x="674" y="373" fill="#9FB0CE" font-size="13" font-weight="700">Live knowledge</text>
      </g>
      <g>
        <circle cx="415" cy="492" r="18" fill="#D6A84A" fill-opacity="0.18" stroke="#D6A84A"/>
        <path d="M406 490C412 480 419 480 425 490C419 500 412 500 406 490Z" stroke="#FFE9B2" stroke-width="3" stroke-linejoin="round"/>
        <text x="448" y="489" fill="#FFF2CD" font-size="18" font-weight="900">Memory</text>
        <text x="448" y="513" fill="#9FB0CE" font-size="13" font-weight="700">Shared context</text>
      </g>
    </g>
  </g>
</svg>
